dependencies:
  espressif/cjson:
    version: "^1.7.19"
  claw_memory:
    # 记忆管理接口 /api/memory 需要 claw_memory 的头文件与实现。
    # 仅靠 CMakeLists 的 REQUIRES 不会把 include 路径传给本组件，
    # 必须在 manifest 中声明，否则精简构建会报 claw_memory.h 找不到。
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MEMORY} == True
    path: ../../../../components/claw_modules/claw_memory

  cap_im_local:
    rules:
      - if: $CONFIG{APP_CLAW_TEXT_ONLY} != True
    path: ../../../../components/claw_capabilities/cap_im_local

  cap_mcp_client:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_MCP_CLIENT} == True
    path: ../../../../components/claw_capabilities/cap_mcp_client

  lua_module_http_server:
    rules:
      - if: $CONFIG{APP_CLAW_CAP_LUA} == True
      - if: $CONFIG{APP_CLAW_LUA_MODULE_HTTP_SERVER} == True
    path: ../../../../components/lua_modules/lua_module_http_server
